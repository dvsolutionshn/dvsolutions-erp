{% extends "core/erp_base.html" %}
{% block title %}Cambiar fecha de factura{% endblock %}
{% block header_title %}Cambiar fecha de factura{% endblock %}
{% block content %}
<section class="erp-card" style="padding:24px;max-width:680px;margin:auto;">
    <h2>Factura {{ factura }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="erp-btn">Guardar fecha</button>
        <a class="erp-btn-secondary" href="{% url 'ver_factura' empresa.slug factura.id %}">Volver</a>
    </form>
</section>
{% endblock %}
