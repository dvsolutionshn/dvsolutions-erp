<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imprimiendo {{ factura.numero_factura }}</title>
    <style>
        html,body{width:100%;height:100%;margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#102338}
        .print-status{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
        .print-status strong{display:block;font-size:20px;margin-bottom:8px}
        .print-status span{display:block;color:#5b6f8e;font-size:14px}
        .print-status button{margin-top:18px;border:0;border-radius:8px;background:#175cd3;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}
        #ticketFrame{position:fixed;width:1px;height:1px;right:0;bottom:0;border:0;opacity:.01;pointer-events:none}
    </style>
</head>
<body>
    <div class="print-status">
        <div>
            <strong id="printTitle">Preparando impresión...</strong>
            <span id="printMessage" role="status">El diálogo de la impresora se abrirá al cargar la factura.</span>
            <button type="button" id="printAgain" hidden>Imprimir ticket</button>
        </div>
    </div>
    <iframe id="ticketFrame" title="Factura para imprimir" data-pdf-url="{{ pdf_url }}" src="about:blank"></iframe>
    <script>
    (function(){
        const frame = document.getElementById("ticketFrame");
        const retryButton = document.getElementById("printAgain");
        const title = document.getElementById("printTitle");
        const message = document.getElementById("printMessage");
        let printStarted = false;
        let pdfReady = false;
        let pdfObjectUrl = "";
        let loading = false;

        async function loadInvoice(){
            if(loading){return;}
            loading = true;
            pdfReady = false;
            printStarted = false;
            retryButton.hidden = true;
            title.textContent = "Preparando impresión...";
            message.textContent = "El diálogo de la impresora se abrirá al cargar la factura.";
            try{
                // Nunca imprimir una redirección al inicio o al formulario de acceso.
                const response = await fetch(frame.dataset.pdfUrl, {
                    credentials: "same-origin",
                    redirect: "error",
                    headers: {"Accept": "application/pdf"}
                });
                const contentType = (response.headers.get("Content-Type") || "").split(";")[0].trim().toLowerCase();
                if(!response.ok || response.redirected || contentType !== "application/pdf"){
                    throw new Error("La respuesta no contiene una factura PDF.");
                }
                const pdf = await response.blob();
                if(!pdf.size){throw new Error("La factura está vacía.");}
                if(pdfObjectUrl){URL.revokeObjectURL(pdfObjectUrl);}
                pdfObjectUrl = URL.createObjectURL(pdf);
                frame.src = pdfObjectUrl;
            }catch(error){
                title.textContent = "No se pudo preparar la impresión";
                message.textContent = "Verificá tu sesión y el permiso «Imprimir o descargar facturas» para esta empresa, e intentá nuevamente.";
                retryButton.textContent = "Reintentar";
                retryButton.hidden = false;
            }finally{
                loading = false;
            }
        }

        function printTicket(){
            if(!pdfReady || printStarted){return;}
            printStarted = true;
            try{
                frame.contentWindow.focus();
                frame.contentWindow.print();
            }catch(error){
                printStarted = false;
                message.textContent = "No se abrió la impresora. Intentá con el botón Imprimir ticket.";
                retryButton.hidden = false;
            }
        }

        frame.addEventListener("load", function(){
            if(!pdfObjectUrl || frame.src !== pdfObjectUrl){return;}
            pdfReady = true;
            title.textContent = "Factura lista para imprimir";
            retryButton.textContent = "Imprimir ticket";
            try{
                frame.contentWindow.addEventListener("afterprint", function(){window.close();});
            }catch(error){
                // El cierre automatico es complementario a la impresion.
            }
            window.setTimeout(printTicket, 450);
            window.setTimeout(function(){retryButton.hidden = false;}, 1800);
        });
        retryButton.addEventListener("click", function(){
            printStarted = false;
            if(pdfReady){printTicket();}else{loadInvoice();}
        });
        window.addEventListener("afterprint", function(){window.close();});
        window.addEventListener("beforeunload", function(){
            if(pdfObjectUrl){URL.revokeObjectURL(pdfObjectUrl);}
        });
        loadInvoice();
    })();
    </script>
</body>
</html>
