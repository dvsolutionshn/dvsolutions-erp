<div class="mi-field mr-field{% if field.widget_type == 'checkboxselectmultiple' %} mr-choice-field{% endif %}" data-recipe-field="{{ field.name }}">
  {% if field.widget_type == 'checkboxselectmultiple' %}<span class="mr-label" id="mr-label-{{ field.html_name }}">{{ field.label }}{% if field.field.required %} *{% endif %}</span><div role="group" aria-labelledby="mr-label-{{ field.html_name }}">{{ field }}</div>
  {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="mr-required" aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% endif %}
  {% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<span class="mi-error" role="alert">{{ error }}</span>{% endfor %}
</div>
