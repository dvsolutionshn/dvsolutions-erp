{% load static %}
<div class="mh-grade-field" data-history-field="{{ field.name }}" data-history-grades data-initial-scale="{{ form.escala_alopecia_activa|default:'' }}"><span class="mh-field-label" id="historyGradeLabel">{{ field.label }}</span><p class="mi-muted mh-scale-label" data-history-scale-label></p><p class="mi-summary-note" data-history-sex-pending hidden>Confirma el sexo del paciente para mostrar la escala correspondiente.</p><div class="mh-grade-grid" role="group" aria-labelledby="historyGradeLabel">
{% for option in field %}<label class="mh-grade-card" data-history-grade-card>{{ option.tag }}<div class="mh-grade-images">{% for etapa in alopecia_hamilton_grados %}{% if etapa.value == option.data.value %}<img src="{% static etapa.imagen %}" alt="Hamilton-Norwood {{ etapa.label }}: {{ etapa.descripcion }}" loading="lazy" data-history-grade-scale="hamilton_norwood">{% endif %}{% endfor %}{% for etapa in alopecia_ludwig_grados %}{% if etapa.value == option.data.value %}<img src="{% static etapa.imagen %}" alt="Ludwig {{ etapa.label }}: {{ etapa.descripcion }}" loading="lazy" data-history-grade-scale="ludwig">{% endif %}{% endfor %}</div><strong>{{ option.choice_label }}</strong></label>{% endfor %}
</div>{% for error in field.errors %}<span class="mi-error" role="alert">{{ error }}</span>{% endfor %}<p class="mi-summary-note">Guía visual del sistema. La clasificación definitiva corresponde al criterio profesional.</p></div>
