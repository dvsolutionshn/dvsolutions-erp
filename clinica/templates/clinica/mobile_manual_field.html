<div class="mi-field mm-field{% if field.widget_type == 'checkbox' %} mm-checkbox-field{% endif %}" data-manual-field="{{ field.name }}">{% if field.widget_type == 'checkbox' %}<label>{{ field }}<span>{{ field.label }}</span></label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="mm-required" aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% endif %}{% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<span class="mi-error" role="alert">{{ error }}</span>{% endfor %}</div>
